name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      # Only the dev group: the exact pinned ruff, without pulling torch and
      # sentence-transformers. `uvx ruff` would float to the newest release and
      # fail on rules the project has not adopted.
      - run: uv run --only-group dev ruff check app evals tests
        working-directory: agent

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npx tsc --noEmit
        working-directory: web
      - run: npm run lint
        working-directory: web

  # No test job yet. The eval suite needs a database, a model API and judge tokens, so
  # it can't gate a commit; the hermetic tests that could are unwritten (agent/tests).
